<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="siteTitle">NewsPortal · Início</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    /* ===== TODOS OS ESTILOS IGUAIS AO SEU ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
      background: #f4f6f9;
      color: #1e2a3a;
      line-height: 1.5;
      padding: 0 1rem;
      transition: background 0.3s, color 0.3s;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    img {
      max-width: 100%;
      height: auto;
      display: block;
    }

    .container {
      max-width: 1280px;
      margin: 0 auto;
      background: white;
      box-shadow: 0 8px 24px rgba(0,0,0,0.05);
      border-radius: 0 0 1.5rem 1.5rem;
      overflow: hidden;
      padding: 0 1.5rem 2rem;
      transition: max-width 0.3s, border-radius 0.3s, background 0.3s;
    }

    /* ===== LOADING ===== */
    .loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      flex-direction: column;
      gap: 1rem;
      transition: opacity 0.5s;
    }

    .loading-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loading-spinner {
      width: 50px;
      height: 50px;
      border: 4px solid #f3f3f3;
      border-top: 4px solid #d32f2f;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* ===== TOPO / HEADER ===== */
    .top-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      padding: 1.2rem 0 0.8rem;
      border-bottom: 2px solid #eef2f7;
      transition: border-color 0.3s;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .logo-icon {
      font-size: 2rem;
      color: #d32f2f;
      transition: color 0.3s;
    }

    .logo {
      font-size: 1.9rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      transition: font-family 0.3s;
    }

    .logo span {
      color: #d32f2f;
      transition: color 0.3s;
    }

    .logo small {
      font-size: 0.75rem;
      font-weight: 400;
      color: #6b7a8f;
      letter-spacing: 0.3px;
      margin-left: 6px;
      transition: color 0.3s;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 1.2rem;
    }

    .header-actions .search-box {
      background: #f0f3f8;
      border-radius: 40px;
      padding: 0.4rem 1rem;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.3s;
    }

    .header-actions .search-box input {
      border: none;
      background: transparent;
      padding: 0.4rem 0;
      font-size: 0.9rem;
      outline: none;
      width: 140px;
      color: inherit;
    }

    .header-actions .search-box i {
      color: #6b7a8f;
      font-size: 0.9rem;
      transition: color 0.3s;
    }

    .btn-assine {
      background: #d32f2f;
      color: white;
      font-weight: 600;
      padding: 0.45rem 1.2rem;
      border-radius: 40px;
      font-size: 0.9rem;
      transition: background 0.3s;
      border: none;
      cursor: default;
    }

    .btn-assine:hover {
      opacity: 0.8;
    }

    /* ===== MENU NAV ===== */
    .main-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 0.2rem 1.2rem;
      padding: 0.8rem 0 0.2rem;
      border-bottom: 1px solid #e6ecf3;
      margin-bottom: 1.8rem;
      font-weight: 500;
      transition: border-color 0.3s;
    }

    .main-nav a {
      padding: 0.3rem 0;
      font-size: 0.95rem;
      color: #2c3e50;
      border-bottom: 3px solid transparent;
      transition: all 0.3s;
    }

    .main-nav a:hover {
      border-bottom-color: #d32f2f;
      color: #0b1a2a;
    }

    .main-nav .active {
      border-bottom-color: #d32f2f;
      color: #0b1a2a;
    }

    .main-nav a i {
      margin-right: 4px;
      font-size: 0.8rem;
      opacity: 0.7;
      transition: color 0.3s;
    }

    .main-nav a.active i {
      opacity: 1;
      color: #d32f2f;
    }

    /* ===== DESTAQUE + GRADE ===== */
    .news-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 2rem;
      margin-bottom: 2.5rem;
    }

    .destaque-principal {
      background: #ffffff;
      border-radius: 1.2rem;
      overflow: hidden;
      box-shadow: 0 2px 12px rgba(0,0,0,0.04);
      transition: all 0.3s;
    }

    .destaque-principal .card-img {
      background: #1e2a3a;
      height: 200px;
      background-image: linear-gradient(145deg, #2c3e50, #1a2634);
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255,255,255,0.2);
      font-size: 2.8rem;
      position: relative;
      transition: background 0.3s;
      overflow: hidden;
    }

    .destaque-principal .card-img a {
      display: block;
      width: 100%;
      height: 100%;
    }

    .destaque-principal .card-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .destaque-principal .card-img i {
      opacity: 0.5;
    }

    .destaque-principal .card-body {
      padding: 1.5rem 1.5rem 1.8rem;
    }

    .destaque-principal .categoria {
      display: inline-block;
      background: #d32f2f;
      color: white;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 0.2rem 1rem;
      border-radius: 30px;
      letter-spacing: 0.3px;
      margin-bottom: 0.7rem;
      text-transform: uppercase;
      transition: background 0.3s;
    }

    .destaque-principal h2 a {
      color: inherit;
      transition: color 0.3s;
    }

    .destaque-principal h2 a:hover {
      color: #d32f2f;
    }

    .destaque-principal h2 {
      font-size: 1.7rem;
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: 0.6rem;
      transition: font-family 0.3s;
    }

    .destaque-principal .resumo {
      color: #3d4e62;
      font-size: 1rem;
      margin-bottom: 0.7rem;
      transition: color 0.3s;
    }

    .meta {
      display: flex;
      gap: 1rem;
      font-size: 0.8rem;
      color: #6b7a8f;
      align-items: center;
      flex-wrap: wrap;
      transition: color 0.3s;
    }

    .meta i {
      margin-right: 4px;
    }

    /* ===== LATERAL ===== */
    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    .ad-box {
      background: #eef2f7;
      border-radius: 1.2rem;
      padding: 1.5rem 1rem;
      text-align: center;
      color: #3d4e62;
      border: 1px dashed #bcc9db;
      transition: all 0.3s;
    }

    .ad-box .ad-label {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #7a8a9e;
      margin-bottom: 0.4rem;
      transition: color 0.3s;
    }

    .ad-box .ad-content {
      font-size: 1.4rem;
      font-weight: 300;
      background: white;
      padding: 1.2rem 0.5rem;
      border-radius: 0.8rem;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,0.02);
      transition: background 0.3s, color 0.3s;
    }

    .ad-box .ad-content i {
      font-size: 2rem;
      color: #b0c0d0;
      margin-right: 6px;
      transition: color 0.3s;
    }

    .ad-box .ad-content strong {
      font-weight: 600;
      color: #1e2a3a;
      transition: color 0.3s;
    }

    .ad-box .ad-content p {
      font-size: 0.7rem;
      color: #6b7a8f;
      margin-top: 0.2rem;
      transition: color 0.3s;
    }

    .sidebar-news {
      background: #fafcff;
      border-radius: 1.2rem;
      padding: 0.2rem 0;
      transition: background 0.3s;
    }

    .sidebar-news a {
      display: block;
      color: inherit;
    }

    .sidebar-news .side-item {
      display: flex;
      gap: 1rem;
      padding: 1rem 0.2rem;
      border-bottom: 1px solid #eceff5;
      align-items: flex-start;
      transition: all 0.3s;
    }

    .sidebar-news .side-item:hover {
      background: #f0f3f8;
      border-radius: 0.8rem;
      padding: 1rem 0.8rem;
    }

    .sidebar-news .side-item:last-child {
      border-bottom: none;
    }

    .side-item .side-thumb {
      min-width: 70
