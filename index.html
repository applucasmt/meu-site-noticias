<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="siteTitle">NewsPortal · Início</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: #f4f6f9; color: #1e2a3a; padding: 0 1rem; }
    a { text-decoration: none; color: inherit; } img { max-width: 100%; height: auto; display: block; }
    .container { max-width: 1280px; margin: 0 auto; background: white; box-shadow: 0 8px 24px rgba(0,0,0,0.05); border-radius: 0 0 1.5rem 1.5rem; overflow: hidden; padding: 0 1.5rem 2rem; }
    #loadingOverlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: white; display: flex; align-items: center; justify-content: center; z-index: 9999; flex-direction: column; transition: opacity 0.5s; }
    #loadingOverlay.hidden { opacity: 0; pointer-events: none; }
    .loading-spinner { width: 50px; height: 50px; border: 4px solid #f3f3f3; border-top: 4px solid #d32f2f; border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    .top-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; padding: 1.2rem 0 0.8rem; border-bottom: 2px solid #eef2f7; }
    .logo-area { display: flex; align-items: center; gap: 0.5rem; } .logo-icon { font-size: 2rem; color: #d32f2f; }
    .logo { font-size: 1.9rem; font-weight: 700; } .logo span { color: #d32f2f; } .logo small { font-size: 0.75rem; color: #6b7a8f; margin-left: 6px; }
    .header-actions { display: flex; align-items: center; gap: 1.2rem; }
    .search-box { background: #f0f3f8; border-radius: 40px; padding: 0.4rem 1rem; display: flex; align-items: center; gap: 6px; }
    .search-box input { border: none; background: transparent; padding: 0.4rem 0; outline: none; width: 140px; }
    .btn-assine { background: #d32f2f; color: white; font-weight: 600; padding: 0.45rem 1.2rem; border-radius: 40px; font-size: 0.9rem; border: none; cursor: pointer; }
    .main-nav { display: flex; gap: 1.2rem; padding: 0.8rem 0 0.2rem; border-bottom: 1px solid #e6ecf3; margin-bottom: 1.8rem; font-weight: 500; }
    .main-nav a { padding: 0.3rem 0; color: #2c3e50; border-bottom: 3px solid transparent; } .main-nav a.active { border-bottom-color: #d32f2f; color: #0b1a2a; }
    .news-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 2rem; margin-bottom: 2.5rem; }
    .destaque-principal { background: white; border-radius: 1.2rem; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,0.04); }
    .destaque-principal .card-img { height: 200px; background: #1e2a3a; display: flex; align-items: center; justify-content: center; font-size: 2.8rem; overflow: hidden; }
    .destaque-principal .card-img img { width: 100%; height: 100%; object-fit: cover; }
    .destaque-principal .card-body { padding: 1.5rem; }
    .categoria { display: inline-block; background: #d32f2f; color: white; font-size: 0.7rem; font-weight: 700; padding: 0.2rem 1rem; border-radius: 30px; margin-bottom: 0.7rem; text-transform: uppercase; }
    .destaque-principal h2 { font-size: 1.7rem; font-weight: 700; margin-bottom: 0.6rem; }
    .meta { display: flex; gap: 1rem; font-size: 0.8rem; color: #6b7a8f; }
    .sidebar { display: flex; flex-direction: column; gap: 2rem; }
    .sidebar-news { background: #fafcff; border-radius: 1.2rem; }
    .side-item { display: flex; gap: 1rem; padding: 1rem 0.2rem; border-bottom: 1px solid #eceff5; }
    .side-item .side-thumb { min-width: 70px; height: 70px; border-radius: 0.8rem; background: #dbe1ea; overflow: hidden; display: flex; align-items: center; justify-content: center; }
    .side-item .side-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .side-item .side-text h4 { font-size: 0.95rem; margin-bottom: 0.2rem; }
    .section-title { font-size: 1.2rem; font-weight: 600; margin: 2rem 0 1.2rem; padding-bottom: 0.4rem; border-bottom: 2px solid #e6ecf3; display: flex; justify-content: space-between; }
    .news-secondary { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1.8rem; }
    .news-card { background: white; border-radius: 1rem; overflow: hidden; border: 1px solid #f0f4fc; }
    .news-card .card-img { height: 130px; background: #cfd9e6; overflow: hidden; }
    .news-card .card-img img { width: 100%; height: 100%; object-fit: cover; }
    .news-card .card-content { padding: 1rem; } .news-card h4 { font-size: 1rem; margin: 0.2rem 0; }
    
    .btn-load-more { display: block; width: 100%; max-width: 300px; margin: 2rem auto 0; padding: 0.8rem; text-align: center; background: #eef2f7; color: #4a5b6e; font-weight: 600; border-radius: 8px; border: none; cursor: pointer; transition: 0.2s; }
    .btn-load-more:hover { background: #dce4f0; color: #1e2a3a; }
    
    #subscribeModal { display: none; position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.6); z-index: 10000; align-items: center; justify-content: center;}
    .sub-box { background: white; padding: 2rem; border-radius: 1rem; text-align: center; max-width: 400px; width: 90%; position: relative; }
    .sub-box h3 { font-size: 1.5rem; margin-bottom: 0.5rem; color:#d32f2f;}
    .sub-box input { width: 100%; padding: 0.8rem; border: 2px solid #e0e6ed; border-radius: 8px; margin: 1rem 0; font-size: 1rem;}
    .sub-box button { background: #27ae60; color: white; border: none; padding: 0.8rem; width: 100%; border-radius: 8px; font-weight: 600; cursor: pointer;}
    .close-sub { position: absolute; top: 15px; right: 15px; background: none; border: none; font-size: 1.2rem; cursor: pointer; color: #6b7a8f; }

    @media (max-width: 900px) { .news-grid { grid-template-columns: 1fr; } }
    @media (max-width: 640px) { .main-nav { font-size: 0.85rem; justify-content: center; } .news-secondary { grid-template-columns: 1fr 1fr; } }
    @media (max-width: 430px) { .news-secondary { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

  <div id="loadingOverlay">
    <div class="loading-spinner"></div>
    <div class="loading-text" style="margin-top:1rem;">Carregando notícias...</div>
  </div>

  <div id="subscribeModal">
    <div class="sub-box">
      <button class="close-sub" onclick="document.getElementById('subscribeModal').style.display='none'"><i class="fas fa-times"></i></button>
      <h3><i class="fas fa-envelope-open-text"></i> Assine nossa Newsletter</h3>
      <p style="color:#6b7a8f; font-size:0.9rem;">Receba as principais notícias do dia diretamente no seu e-mail.</p>
      <form onsubmit="handleSubscribe(event)">
        <input type="email" id="subEmail" placeholder="Seu melhor e-mail" required>
        <button type="submit">Assinar Gratuitamente</button>
      </form>
    </div>
  </div>

  <div id="mainContent" class="container" style="display:none;">
    <header class="top-bar">
      <div class="logo-area"><span class="logo-icon" id="logoIcon"><i class="fas fa-newspaper"></i></span><div class="logo" id="logoText">News<span>Portal</span></div></div>
      <div class="header-actions">
        <div class="search-box"><i class="fas fa-search"></i><input type="text" placeholder="Buscar..." id="searchInput"></div>
        <button class="btn-assine" onclick="document.getElementById('subscribeModal').style.display='flex'"><i class="fas fa-user-plus"></i> Assine</button>
      </div>
    </header>

    <nav class="main-nav" id="mainNav"></nav>

    <div class="news-grid">
      <article class="destaque-principal" id="destaquePrincipal">
        <div class="card-img" id="destaqueImg"></div>
        <div class="card-body">
          <span class="categoria" id="destaqueCategoria">Destaque</span>
          <h2 id="destaqueTitulo"></h2>
          <p class="resumo" id="destaqueResumo"></p>
          <div class="meta" id="destaqueMeta"></div>
        </div>
      </article>

      <aside class="sidebar">
        <div class="sidebar-news" id="sidebarNews"></div>
      </aside>
    </div>

    <div class="section-title"><span><i class="fas fa-arrow-right"></i> Mais notícias</span></div>
    <div class="news-secondary" id="materiasList"></div>
    <button class="btn-load-more" id="btnLoadMore" onclick="loadMore()">Carregar mais notícias <i class="fas fa-chevron-down"></i></button>
  </div>

  <script src="data/database.js"></script>
  <script>
    let currentPage = 1;
    const itemsPerPage = 6;

    function applySettings() {
      const s = window.DB.getSettings();
      if (!s) return;
      document.body.style.fontFamily = s.fontFamily || 'Segoe UI, sans-serif';
      if (document.getElementById('logoIcon')) document.getElementById('logoIcon').style.color = s.primaryColor || '#d32f2f';
      if (document.getElementById('logoText')) document.getElementById('logoText').innerHTML = s.logoText || 'News<span>Portal</span>';
    }

    function renderMenus() {
      const cats = window.DB.getCategories() || [];
      document.getElementById('mainNav').innerHTML = `<a href="index.html" class="active">Últimas</a>` + 
        cats.map(c => `<a href="${c.slug}.html"><i class="fas ${c.icon}"></i> ${c.name}</a>`).join('');
    }

    function renderDestaque() {
      const materias = window.DB.getMaterias() || [];
      if (!materias.length) return;
      const top = materias[0];
      
      document.getElementById('destaqueImg').innerHTML = `<a href="noticia.html?id=${top.id}">${top.image ? `<img src="${top.image}">` : '<i class="fas fa-image"></i>'}</a>`;
      document.getElementById('destaqueCategoria').innerHTML = top.category || 'Destaque';
      document.getElementById('destaqueTitulo').innerHTML = `<a href="noticia.html?id=${top.id}">${top.title}</a>`;
      
      const div = document.createElement('div');
      div.innerHTML = top.content || '';
      document.getElementById('destaqueResumo').textContent = (div.textContent || '').substring(0, 150) + '...';
    }

    function renderSidebar() {
      const materias = window.DB.getMaterias() || [];
      document.getElementById('sidebarNews').innerHTML = materias.slice(1, 5).map(m => `
        <a href="noticia.html?id=${m.id}">
          <div class="side-item"><div class="side-thumb">${m.image ? `<img src="${m.image}">` : '<i class="fas fa-image"></i>'}</div>
          <div class="side-text"><h4>${m.title}</h4></div></div>
        </a>`).join('');
    }

    function renderMateriasList(reset = false) {
      if(reset) currentPage = 1;
      const all = window.DB.getMaterias().slice(5);
      const visible = all.slice(0, currentPage * itemsPerPage);
      
      const s = window.DB.getSettings() || {};
      document.getElementById('materiasList').innerHTML = visible.map(m => `
        <div class="news-card"><a href="noticia.html?id=${m.id}">
          <div class="card-img">${m.image ? `<img src="${m.image}">` : '<i class="fas fa-image"></i>'}</div>
          <div class="card-content"><span class="tag" style="color:${s.primaryColor || '#d32f2f'}">${m.category}</span><h4>${m.title}</h4></div>
        </a></div>`).join('');
        
      document.getElementById('btnLoadMore').style.display = visible.length >= all.length ? 'none' : 'block';
    }

    function loadMore() { currentPage++; renderMateriasList(); }

    function handleSubscribe(e) {
      e.preventDefault();
      const email = document.getElementById('subEmail').value;
      if (window.DB) window.DB.subscribe(email);
      alert('Inscrito com sucesso!');
      document.getElementById('subscribeModal').style.display = 'none';
    }

    document.addEventListener('DOMContentLoaded', async () => {
      try {
        if (typeof window.Database === 'undefined') {
          throw new Error('O arquivo database.js não carregou. Verifique a sua conexão ou arquivo.');
        }

        // A CORREÇÃO PRINCIPAL ESTÁ AQUI (Atribuição do window.DB)
        window.DB = await window.Database.init();
        
        applySettings(); 
        renderMenus(); 
        renderDestaque(); 
        renderSidebar(); 
        renderMateriasList(true);
        
        document.getElementById('loadingOverlay').style.display = 'none';
        document.getElementById('mainContent').style.display = 'block';

      } catch (error) {
        console.error('Erro Fatal de Carregamento:', error);
        document.getElementById('loadingOverlay').innerHTML = `
          <div style="text-align:center; padding: 2rem; background: white; max-width: 400px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1);">
            <i class="fas fa-exclamation-triangle" style="font-size:3rem; color:#e74c3c; margin-bottom:1rem;"></i>
            <h2 style="color:#1e2a3a; margin-bottom: 0.5rem;">Ops! Ocorreu um problema</h2>
            <p style="color:#6b7a8f; margin-bottom: 1.5rem; font-size: 0.9rem;">${error.message}</p>
            <button onclick="location.reload()" style="padding:0.6rem 1.5rem; background:#3498db; color:white; border:none; border-radius:6px; font-weight:bold; cursor:pointer;">Tentar Novamente</button>
          </div>
        `;
      }
    });
  </script>
</body>
</html>
