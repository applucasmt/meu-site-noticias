<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- SEO & COMPARTILHAMENTO (Genérico para Sites Estáticos) -->
  <meta property="og:type" content="article">
  <meta property="og:site_name" content="NewsPortal">
  <meta property="og:title" content="NewsPortal - Leia as últimas notícias">
  <meta property="og:description" content="Fique por dentro das principais novidades.">
  <meta property="og:image" content="https://i.imgur.com/k91Jv6N.png"> <!-- Você pode trocar este link pela URL da sua logo no Google Drive -->
  
  <title id="pageTitle">NewsPortal · Notícia</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; } body { font-family: 'Segoe UI', sans-serif; background: #f4f6f9; color: #1e2a3a; line-height: 1.6; padding: 0 1rem; }
    a { text-decoration: none; color: inherit; } img { max-width: 100%; height: auto; display: block; }
    .container { max-width: 1280px; margin: 0 auto; background: white; box-shadow: 0 8px 24px rgba(0,0,0,0.05); border-radius: 0 0 1.5rem 1.5rem; overflow: hidden; padding: 0 1.5rem 2rem; }
    .top-bar { display: flex; align-items: center; justify-content: space-between; padding: 1.2rem 0 0.8rem; border-bottom: 2px solid #eef2f7; }
    .logo-area { display: flex; align-items: center; gap: 0.5rem; } .logo-icon { font-size: 2rem; color: #d32f2f; }
    .logo { font-size: 1.9rem; font-weight: 700; } .logo span { color: #d32f2f; } 
    
    .noticia-container { max-width: 820px; margin: 0 auto; padding: 1rem 0 2rem; }
    .noticia-header { margin-bottom: 1.5rem; }
    .noticia-header .categoria { display: inline-block; background: #d32f2f; color: white; font-size: 0.7rem; font-weight: 700; padding: 0.2rem 1rem; border-radius: 30px; margin-bottom: 0.7rem; text-transform: uppercase; }
    .noticia-header h1 { font-size: 2.2rem; font-weight: 700; line-height: 1.2; margin-bottom: 0.5rem; }
    .noticia-header .meta { display: flex; gap: 1.5rem; font-size: 0.85rem; color: #6b7a8f; align-items: center; flex-wrap: wrap; margin-top: 0.5rem; }
    
    .noticia-img { margin: 1.5rem 0; border-radius: 1rem; overflow: hidden; background: #1e2a3a; }
    .noticia-img img { width: 100%; max-height: 500px; object-fit: cover; }
    .noticia-content { font-size: 1.1rem; line-height: 1.8; color: #1e2a3a; }
    .noticia-content p { margin-bottom: 1.2rem; } .noticia-content img { max-width: 100%; border-radius: 0.5rem; margin: 1rem 0; }
    
    .article-tags { margin-top: 2rem; display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .article-tags span { background: #eef2f7; color: #4a5b6e; padding: 0.3rem 0.8rem; border-radius: 4px; font-size: 0.85rem; font-weight: 600; }
    
    .noticia-footer { margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid #eef2f7; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; }
    .share-buttons { display: flex; gap: 0.5rem; } .share-buttons a { padding: 0.4rem 0.8rem; border-radius: 6px; color: white; font-size: 0.8rem; }
    .whatsapp { background: #25D366; } .facebook { background: #1877F2; } .twitter { background: #000000; }
    .preview-banner { background: #f39c12; color: white; text-align: center; padding: 0.5rem; font-weight: bold; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div id="previewBanner" class="preview-banner" style="display: none;"><i class="fas fa-eye"></i> MODO DE VISUALIZAÇÃO (NÃO PÚBLICO)</div>
  <div class="container">
    <header class="top-bar">
      <div class="logo-area"><span class="logo-icon"><i class="fas fa-newspaper"></i></span><div class="logo">News<span>Portal</span></div></div>
    </header>
    <div class="noticia-container" id="noticiaContainer"></div>
  </div>

  <script src="data/database.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await window.Database.init();
      
      const urlParams = new URLSearchParams(window.location.search);
      const isPreview = urlParams.get('preview') === 'true';
      const noticiaId = parseInt(urlParams.get('id'));
      
      let materia;
      if(isPreview) {
        document.getElementById('previewBanner').style.display = 'block';
        materia = JSON.parse(sessionStorage.getItem('preview_materia'));
      } else {
        materia = window.DB.getMateriaById(noticiaId);
        if(materia) window.DB.incrementViews(materia.id);
      }

      if (!materia) {
        document.getElementById('noticiaContainer').innerHTML = `<h2>Notícia não encontrada</h2><a href="index.html">Voltar</a>`;
        return;
      }

      document.title = materia.title;

      const date = new Date(materia.date).toLocaleString('pt-BR', { day: '2-digit', month: 'long', year: 'numeric' });
      const tagsHtml = materia.tags ? materia.tags.split(',').map(t => `<span>#${t.trim()}</span>`).join('') : '';

      document.getElementById('noticiaContainer').innerHTML = `
        <div class="noticia-header">
          <span class="categoria">${materia.category}</span>
          <h1>${materia.title}</h1>
          <div class="meta"><span><i class="far fa-calendar-alt"></i> ${date}</span><span><i class="far fa-user"></i> ${materia.author || 'Redação'}</span></div>
        </div>
        <div class="noticia-img">${materia.image ? `<img src="${materia.image}">` : ''}</div>
        <div class="noticia-content">${materia.content}</div>
        ${tagsHtml ? `<div class="article-tags">${tagsHtml}</div>` : ''}
        <div class="noticia-footer">
          <a href="javascript:history.back()"><i class="fas fa-arrow-left"></i> Voltar</a>
          <div class="share-buttons">
            <a href="https://api.whatsapp.com/send?text=${encodeURIComponent(materia.title + ' - ' + window.location.href)}" class="whatsapp" target="_blank"><i class="fab fa-whatsapp"></i> Compartilhar</a>
          </div>
        </div>
      `;
    });
  </script>
</body>
</html>
