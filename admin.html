<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NewsPortal · Admin</title>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
  <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', Roboto, sans-serif; background: #f0f2f5; color: #1e2a3a; padding: 1rem; }
    .admin-container { max-width: 1200px; margin: 0 auto; background: white; border-radius: 1.5rem; padding: 2rem; box-shadow: 0 8px 30px rgba(0,0,0,0.08); }
    .admin-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; padding-bottom: 1rem; border-bottom: 2px solid #eef2f7; margin-bottom: 2rem; }
    .admin-header h1 { display: flex; align-items: center; gap: 0.5rem; font-size: 1.8rem; }
    .admin-header h1 i { color: #d32f2f; }
    .header-actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .header-actions a, .header-actions button { padding: 0.5rem 1.2rem; border-radius: 30px; text-decoration: none; font-weight: 600; border: none; cursor: pointer; transition: 0.2s; font-size: 0.9rem; }
    .btn-back { background: #3498db; color: white; } .btn-back:hover { background: #2980b9; }
    .btn-logout { background: #e74c3c; color: white; } .btn-logout:hover { background: #c0392b; }
    
    .admin-tabs { display: flex; gap: 0.3rem; flex-wrap: wrap; margin-bottom: 2rem; border-bottom: 2px solid #eef2f7; padding-bottom: 0.5rem; }
    .admin-tabs button { padding: 0.5rem 1.2rem; border: none; background: transparent; font-weight: 600; cursor: pointer; border-radius: 8px 8px 0 0; transition: 0.2s; color: #6b7a8f; font-size: 0.9rem; }
    .admin-tabs button:hover { background: #f0f3f8; }
    .admin-tabs button.active { background: #3498db; color: white; }
    .admin-panel { display: none; } .admin-panel.active { display: block; }
    
    /* LOGIN OVERLAY */
    #loginOverlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: #f0f2f5; z-index: 10000;
      display: flex; align-items: center; justify-content: center;
    }
    .login-box {
      background: white; padding: 2.5rem; border-radius: 1.5rem;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08); width: 100%; max-width: 400px;
      text-align: center;
    }
    .login-box h2 { font-size: 1.8rem; margin-bottom: 0.5rem; color: #1e2a3a; }
    .login-box p { color: #6b7a8f; margin-bottom: 1.5rem; font-size: 0.9rem; }
    .login-box input {
      width: 100%; padding: 0.8rem 1rem; margin-bottom: 1rem;
      border: 2px solid #e0e6ed; border-radius: 8px; font-size: 1rem; transition: 0.2s;
    }
    .login-box input:focus { border-color: #3498db; outline: none; }
    .login-box button {
      width: 100%; padding: 0.8rem; background: #d32f2f; color: white;
      border: none; border-radius: 8px; font-size: 1.1rem; font-weight: 600;
      cursor: pointer; transition: 0.2s;
    }
    .login-box button:hover { background: #b71c1c; }
    .login-box button:disabled { background: #95a5a6; cursor: not-allowed; }

    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
    .stat-card { background: #f8f9fa; padding: 1.2rem; border-radius: 0.8rem; text-align: center; }
    .stat-card .number { font-size: 2rem; font-weight: 700; color: #d32f2f; }
    .stat-card .label { color: #6b7a8f; font-size: 0.8rem; }
    .admin-form { background: #f8f9fa; padding: 1.5rem; border-radius: 1rem; margin-top: 1rem; display: flex; flex-wrap: wrap; gap: 1rem; align-items: flex-end; }
    .admin-form .form-group { flex: 1; min-width: 180px; }
    .admin-form label { display: block; font-size: 0.8rem; font-weight: 600; color: #4a5b6e; margin-bottom: 0.2rem; }
    .admin-form input, .admin-form select { width: 100%; padding: 0.6rem 0.8rem; border: 2px solid #e0e6ed; border-radius: 8px; font-size: 0.9rem; transition: 0.2s; }
    .admin-form input:focus, .admin-form select:focus { border-color: #3498db; outline: none; }
    .admin-form button { padding: 0.6rem 1.5rem; background: #27ae60; color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.2s; min-width: 120px; }
    .admin-form button:hover { background: #229954; }
    .admin-table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    .admin-table th { text-align: left; padding: 0.8rem; background: #f8f9fa; font-weight: 600; border-bottom: 2px solid #eef2f7; }
    .admin-table td { padding: 0.8rem; border-bottom: 1px solid #eef2f7; vertical-align: middle; }
    .admin-table .drag-handle { cursor: grab; color: #bcc9db; padding: 0 0.5rem; }
    .admin-table .btn-icon { background: none; border: none; cursor: pointer; padding: 0.3rem 0.6rem; border-radius: 4px; transition: 0.2s; font-size: 0.9rem; }
    .admin-table .btn-icon:hover { background: #f0f3f8; }
    .admin-table .btn-icon.btn-danger:hover { background: #fee; color: #e74c3c; }
    .status-badge { padding: 0.15rem 0.6rem; border-radius: 12px; font-size: 0.7rem; font-weight: 600; }
    .status-badge.active { background: #d4edda; color: #155724; }
    .status-badge.inactive { background: #f8d7da; color: #721c24; }
    
    .materia-item { display: flex; justify-content: space-between; align-items: center; padding: 0.8rem; border-bottom: 1px solid #eef2f7; flex-wrap: wrap; gap: 1rem; }
    .materia-item .materia-thumb { width: 60px; height: 60px; border-radius: 8px; background: #eef2f7; display: flex; align-items: center; justify-content: center; color: #bcc9db; font-size: 1.5rem; flex-shrink: 0; overflow: hidden; }
    .materia-item .materia-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .materia-item .materia-info { flex: 1; min-width: 200px; }
    .materia-item .materia-info h4 { font-size: 1rem; margin-bottom: 0.2rem; }
    .materia-item .materia-info .materia-meta { font-size: 0.8rem; color: #6b7a8f; }
    .materia-item .materia-actions { display: flex; gap: 0.3rem; }
    .materia-item .materia-actions button { padding: 0.4rem 0.8rem; border: none; border-radius: 4px; cursor: pointer; font-size: 0.8rem; transition: 0.2s; color:white; }
    
    .btn-edit { background: #3498db; } .btn-edit:hover { background: #2980b9; }
    .btn-delete { background: #e74c3c; } .btn-delete:hover { background: #c0392b; }
    .status-published { background: #27ae60; color: white; padding: 0.1rem 0.5rem; border-radius: 12px; font-size: 0.65rem; font-weight: 600; }
    .status-draft { background: #f39c12; color: white; padding: 0.1rem 0.5rem; border-radius: 12px; font-size: 0.65rem; font-weight: 600; }
    .history-item { padding: 0.6rem 0; border-bottom: 1px solid #eef2f7; display: flex; justify-content: space-between; font-size: 0.9rem; }
    .history-item .h-time { color: #6b7a8f; font-size: 0.8rem; }
    
    .settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; background: #f8f9fa; padding: 1.5rem; border-radius: 1rem; }
    .settings-grid .full-width { grid-column: 1 / -1; }
    .settings-grid .form-group { display: flex; flex-direction: column; gap: 0.3rem; }
    .settings-grid .form-group label { font-size: 0.8rem; font-weight: 600; color: #4a5b6e; }
    .settings-grid .form-group input, .settings-grid .form-group select { padding: 0.6rem 0.8rem; border: 2px solid #e0e6ed; border-radius: 8px; font-size: 0.9rem; transition: 0.2s; }
    .settings-grid .form-group input:focus, .settings-grid .form-group select:focus { border-color: #3498db; outline: none; }
    .settings-grid .form-group .color-input-group { display: flex; align-items: center; gap: 0.5rem; }
    .settings-grid .form-group .color-input-group input[type="color"] { width: 50px; height: 40px; border: 2px solid #e0e6ed; border-radius: 6px; padding: 2px; cursor: pointer; }
    .settings-grid .form-group .color-input-group input[type="text"] { flex: 1; }
    
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); z-index: 9999; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
    .modal-overlay.visible { display: flex; }
    .modal-box { background: white; padding: 2rem; border-radius: 1.5rem; max-width: 900px; width: 95%; max-height: 90vh; overflow-y: auto; }
    .modal-box .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
    .modal-box .modal-header h3 { font-size: 1.2rem; }
    .modal-box .modal-header .close-modal { background: #e74c3c; color: white; border: none; padding: 0.3rem 1.2rem; border-radius: 6px; cursor: pointer; }
    .modal-box label { display: block; font-weight: 600; font-size: 0.9rem; margin-bottom: 0.3rem; color: #2c3e50; margin-top: 1rem; }
    .modal-box input[type="text"], .modal-box select { width: 100%; padding: 0.7rem 1rem; border: 2px solid #e0e6ed; border-radius: 8px; font-size: 0.95rem; }
    
    /* QUILL EDITOR OVERRIDES */
    #editor-container { height: 300px; font-family: inherit; font-size: 1rem; border-radius: 0 0 8px 8px; border: 2px solid #e0e6ed; border-top: none; }
    .ql-toolbar.ql-snow { border: 2px solid #e0e6ed; border-radius: 8px 8px 0 0; background: #f8f9fa; }
    
    .editor-actions { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 1.5rem; }
    .editor-actions button { padding: 0.6rem 1.5rem; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; color: white; }
    .btn-publish { background: #27ae60; } .btn-preview { background: #8e44ad; } .btn-draft { background: #f39c12; } .btn-cancel { background: #e74c3c; }

    .upload-group { display: flex; gap: 0.5rem; }
    .btn-upload { background: #3498db; color: white; border: none; padding: 0 1rem; border-radius: 8px; cursor: pointer; font-weight: 600; white-space: nowrap; }
    
    @media (max-width: 768px) { .settings-grid { grid-template-columns: 1fr; } }
    @media (max-width: 640px) {
      .admin-container { padding: 1rem; } .admin-header { flex-direction: column; align-items: stretch; }
      .admin-form { flex-direction: column; } .admin-form .form-group { min-width: 100%; }
      .admin-table { font-size: 0.8rem; } .admin-table th, .admin-table td { padding: 0.5rem; } .modal-box { padding: 1rem; }
    }
  </style>
</head>
<body>

<div id="loginOverlay">
  <form class="login-box" id="loginForm">
    <i class="fas fa-user-circle" style="font-size: 3.5rem; color: #d32f2f; margin-bottom: 1rem;"></i>
    <h2>Acesso Restrito</h2>
    <p>Insira suas credenciais para acessar o painel</p>
    <input type="text" id="loginUser" placeholder="Usuário" required>
    <input type="password" id="loginPass" placeholder="Senha" required>
    <button type="submit" id="loginBtn">Entrar</button>
    <a href="index.html" style="display: block; margin-top: 1.5rem; color: #6b7a8f; font-size: 0.9rem;"><i class="fas fa-arrow-left"></i> Voltar ao site</a>
  </form>
</div>

<div class="admin-container">
  <div class="admin-header">
    <h1><i class="fas fa-cog"></i> Painel Administrativo</h1>
    <div class="header-actions">
      <a href="index.html" class="btn-back"><i class="fas fa-arrow-left"></i> Ver Site</a>
      <button class="btn-logout" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Sair</button>
    </div>
  </div>

  <div class="admin-tabs">
    <button class="active" onclick="switchTab('dashboard')">Dashboard</button>
    <button onclick="switchTab('settings')">Personalizar</button>
    <button onclick="switchTab('categories')">Categorias</button>
    <button onclick="switchTab('materias')">Matérias</button>
    <button onclick="switchTab('users')">Usuários</button>
    <button onclick="switchTab('history')">Histórico</button>
  </div>

  <div class="admin-panel active" id="panel-dashboard">
    <div class="stats-grid">
      <div class="stat-card"><div class="number" id="totalMaterias">0</div><div class="label">Matérias Publicadas</div></div>
      <div class="stat-card"><div class="number" id="totalCategories">0</div><div class="label">Categorias</div></div>
      <div class="stat-card"><div class="number" id="totalViews">0</div><div class="label">Visualizações</div></div>
    </div>
    <h3 style="margin-bottom:1rem;"><i class="fas fa-clock"></i> Últimas Matérias</h3>
    <div id="lastMaterias"></div>
  </div>

  <div class="admin-panel" id="panel-settings">
    <form id="settingsForm" class="settings-grid">
      <div class="full-width"><h4><i class="fas fa-paint-bucket"></i> Cores</h4></div>
      <div class="form-group"><label>Cor Primária</label><div class="color-input-group"><input type="color" id="primaryColor"><input type="text" id="primaryColorText"></div></div>
      <div class="form-group"><label>Cor Secundária</label><div class="color-input-group"><input type="color" id="secondaryColor"><input type="text" id="secondaryColorText"></div></div>
      <div class="form-group"><label>Cor de Fundo</label><div class="color-input-group"><input type="color" id="backgroundColor"><input type="text" id="backgroundColorText"></div></div>
      <div class="form-group"><label>Cor do Texto</label><div class="color-input-group"><input type="color" id="textColor"><input type="text" id="textColorText"></div></div>
      <div class="full-width"><h4><i class="fas fa-font"></i> Fontes & Logo</h4></div>
      <div class="form-group"><label>Fonte Principal</label><input type="text" id="fontFamily"></div>
      <div class="form-group"><label>Fonte de Títulos</label><input type="text" id="headingFont"></div>
      <div class="form-group"><label>Texto do Logo</label><input type="text" id="logoText"></div>
      <div class="form-group"><label>Subtexto do Logo</label><input type="text" id="logoSubtext"></div>
      <div class="form-group"><label>Ícone do Logo</label><input type="text" id="logoIcon"></div>
      <div class="full-width"><h4><i class="fas fa-layer-group"></i> Layout</h4></div>
      <div class="form-group"><label>Largura Máxima</label><select id="containerMaxWidth"><option value="1280px">1280px (Padrão)</option><option value="1440px">1440px (Grande)</option><option value="1100px">1100px (Compacto)</option><option value="100%">100% (Fluido)</option></select></div>
      <div class="form-group"><label>Raio das Bordas</label><select id="borderRadius"><option value="1.5rem">1.5rem (Padrão)</option><option value="0.5rem">0.5rem (Pequeno)</option><option value="2rem">2rem (Grande)</option><option value="0">0 (Sem borda)</option></select></div>
      <button type="submit" class="btn-save-settings"><i class="fas fa-save"></i> Salvar Personalização</button>
    </form>
  </div>

  <div class="admin-panel" id="panel-categories">
    <form class="admin-form" id="categoryForm">
      <div class="form-group"><label>Nome da Categoria</label><input type="text" id="catName" required></div>
      <div class="form-group">
        <label>Ícone (Selecione)</label>
        <select id="catIcon">
          <option value="fa-tag">🏷️ Tag (Padrão)</option>
          <option value="fa-gavel">⚖️ Política / Leis</option>
          <option value="fa-chart-line">📈 Economia / Finanças</option>
          <option value="fa-microchip">💻 Tecnologia</option>
          <option value="fa-heartbeat">⚕️ Saúde</option>
          <option value="fa-film">🎬 Cultura / Entretenimento</option>
          <option value="fa-futbol">⚽ Esportes</option>
          <option value="fa-globe-americas">🌎 Internacional</option>
          <option value="fa-graduation-cap">🎓 Educação</option>
          <option value="fa-leaf">🍃 Meio Ambiente</option>
          <option value="fa-car">🚗 Veículos</option>
          <option value="fa-gamepad">🎮 Games</option>
          <option value="fa-music">🎵 Música</option>
          <option value="fa-utensils">🍽️ Gastronomia</option>
          <option value="fa-plane">✈️ Viagens / Turismo</option>
          <option value="fa-city">🏙️ Cidades / Local</option>
        </select>
      </div>
      <button type="submit"><i class="fas fa-plus"></i> Adicionar</button>
    </form>
    <table class="admin-table" id="categoriesTable">
      <thead><tr><th>Nome</th><th>Slug</th><th>Ícone</th><th>Status</th><th style="text-align:right;">Ações</th></tr></thead>
      <tbody id="categoriesBody"></tbody>
    </table>
  </div>

  <div class="admin-panel" id="panel-materias">
    <button onclick="openEditor()" style="background:#27ae60; color:white; border:none; padding:0.5rem 1.2rem; border-radius:8px; font-weight:600; cursor:pointer; margin-bottom:1rem;"><i class="fas fa-plus"></i> Nova Matéria</button>
    <div id="materiasListAdmin"></div>
  </div>

  <div class="admin-panel" id="panel-users">
    <form class="admin-form" id="userForm">
      <div class="form-group"><label>Usuário</label><input type="text" id="newUsername" required></div>
      <div class="form-group"><label>Senha</label><input type="password" id="newPassword" required></div>
      <div class="form-group"><label>Nível</label><select id="newUserLevel"><option value="admin">Administrador</option><option value="editor">Editor</option><option value="journalist">Jornalista</option></select></div>
      <button type="submit"><i class="fas fa-plus"></i> Adicionar</button>
    </form>
    <h3 style="margin-top:2rem;"><i class="fas fa-users"></i> Usuários Cadastrados</h3>
    <div id="usersList"></div>
  </div>

  <div class="admin-panel" id="panel-history">
    <div id="historyListAdmin"></div>
  </div>

</div>

<!-- MODAL EDITOR (QUILL + UPLOAD DE IMAGEM) -->
<div class="modal-overlay" id="editorModal">
  <div class="modal-box">
    <div class="modal-header"><h3 id="editorTitle">Nova Matéria</h3><button class="close-modal" onclick="closeEditor()">Fechar</button></div>

    <label>Título</label><input type="text" id="editTitle">
    <label>Categoria</label><select id="editCategory"></select>
    <label>Tags (separadas por vírgula)</label><input type="text" id="editTags" placeholder="Ex: tecnologia, inovação">
    
    <label>Imagem da Capa (Upload pro Google Drive)</label>
    <div class="upload-group">
      <input type="text" id="editImage" placeholder="URL da imagem (ou faça upload ao lado)">
      <input type="file" id="fileInput" style="display:none" accept="image/*" onchange="handleImageUpload(event)">
      <button type="button" class="btn-upload" onclick="document.getElementById('fileInput').click()"><i class="fas fa-upload"></i> Upload</button>
    </div>

    <label>Conteúdo</label>
    <div id="editor-container"></div>

    <div class="editor-actions">
      <button class="btn-publish" onclick="saveMateria('published')"><i class="fas fa-check-circle"></i> Publicar</button>
      <button class="btn-preview" onclick="previewMateria()"><i class="fas fa-eye"></i> Preview</button>
      <button class="btn-draft" onclick="saveMateria('draft')"><i class="fas fa-save"></i> Salvar Rascunho</button>
      <button class="btn-cancel" onclick="closeEditor()"><i class="fas fa-times"></i> Cancelar</button>
    </div>
  </div>
</div>

<script src="data/database.js"></script>
<script>
  let editingMateriaId = null;
  let quill; 

  function initAdminPanel() {
    quill = new Quill('#editor-container', {
      theme: 'snow',
      modules: { toolbar: [ [{ 'header': [2, 3, false] }], ['bold', 'italic', 'underline', 'strike'], [{ 'color': [] }, { 'background': [] }], [{ 'list': 'ordered'}, { 'list': 'bullet' }], ['link', 'image', 'video'], ['clean'] ] }
    });
    updateDashboard(); loadSettings(); renderCategories(); renderMateriasAdmin(); renderHistory(); renderUsers();
  }

  async function handleImageUpload(e) {
    const file = e.target.files[0];
    if(!file) return;
    const btn = document.querySelector('.btn-upload');
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Enviando...';
    try {
      const res = await window.DB.uploadImage(file);
      if(res.success) document.getElementById('editImage').value = res.url;
      else alert('Erro ao subir imagem');
    } catch(err) { alert('Erro na conexão'); }
    btn.innerHTML = '<i class="fas fa-upload"></i> Upload';
  }

  function formatDate(dateStr) { return new Date(dateStr).toLocaleString('pt-BR', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }); }

  function switchTab(tab) {
    document.querySelectorAll('.admin-panel').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.admin-tabs button').forEach(b => b.classList.remove('active'));
    document.getElementById(`panel-${tab}`).classList.add('active');
    document.querySelector(`.admin-tabs button[onclick*="${tab}"]`).classList.add('active');
    if (tab === 'dashboard') updateDashboard(); if (tab === 'settings') loadSettings(); if (tab === 'categories') renderCategories(); if (tab === 'materias') renderMateriasAdmin(); if (tab === 'history') renderHistory(); if (tab === 'users') renderUsers();
  }

  function updateDashboard() {
    const materias = window.DB.getAllMaterias();
    document.getElementById('totalMaterias').textContent = materias.filter(m => m.status === 'published').length;
    document.getElementById('totalCategories').textContent = window.DB.getCategories().length;
    document.getElementById('totalViews').textContent = materias.reduce((s, m) => s + (m.views||0), 0);
    document.getElementById('lastMaterias').innerHTML = materias.slice(0,5).map(m => `
      <div class="materia-item"><div class="materia-thumb">${m.image ? `<img src="${m.image}">` : '<i class="fas fa-image"></i>'}</div>
      <div class="materia-info"><h4>${m.title}</h4><div class="materia-meta">${m.status==='published'?'Publicado':'Rascunho'} · ${formatDate(m.date)}</div></div></div>
    `).join('');
  }

  function renderMateriasAdmin() {
    document.getElementById('materiasListAdmin').innerHTML = window.DB.getAllMaterias().map(m => `
      <div class="materia-item"><div class="materia-thumb">${m.image ? `<img src="${m.image}">` : '<i class="fas fa-image"></i>'}</div>
      <div class="materia-info"><h4>${m.title}</h4><div class="materia-meta"><span class="${m.status==='published'?'status-published':'status-draft'}">${m.status==='published'?'Publicado':'Rascunho'}</span> ${m.category} · Autor: ${m.author} · ${formatDate(m.date)}</div></div>
      <div class="materia-actions"><button class="btn-edit" onclick="editMateria(${m.id})"><i class="fas fa-edit"></i></button><button class="btn-delete" onclick="deleteMateria(${m.id})"><i class="fas fa-trash"></i></button></div></div>
    `).join('');
  }

  function loadSettings() {
    const s = window.DB.getSettings();
    ['primaryColor', 'secondaryColor', 'backgroundColor', 'textColor', 'fontFamily', 'headingFont', 'logoText', 'logoSubtext', 'logoIcon', 'containerMaxWidth', 'borderRadius'].forEach(id => {
      if(document.getElementById(id)) document.getElementById(id).value = s[id] || '';
    });
    ['primaryColor', 'secondaryColor', 'backgroundColor', 'textColor'].forEach(id => {
      if(document.getElementById(id+'Text')) document.getElementById(id+'Text').value = s[id] || '';
    });
  }

  function renderCategories() {
    document.getElementById('categoriesBody').innerHTML = window.DB.getAllCategories().map(cat => `
      <tr data-id="${cat.id}"><td>${cat.name}</td><td>/${cat.slug}.html</td><td><i class="fas ${cat.icon}"></i></td>
      <td><span class="status-badge ${cat.active ? 'active' : 'inactive'}">${cat.active ? 'Ativo' : 'Inativo'}</span></td>
      <td style="text-align:right;"><button class="btn-icon" onclick="toggleCategoryStatus(${cat.id})"><i class="fas ${cat.active ? 'fa-eye' : 'fa-eye-slash'}"></i></button><button class="btn-icon btn-danger" onclick="deleteCategory(${cat.id})"><i class="fas fa-trash"></i></button></td></tr>
    `).join('');
  }

  function toggleCategoryStatus(id) {
    const cat = window.DB.cache.categories.find(c => c.id === id);
    if (cat) { window.DB.editCategory(id, { active: !cat.active }); renderCategories(); }
  }

  function deleteCategory(id) { if (confirm('Desativar categoria?')) { window.DB.deleteCategory(id); renderCategories(); } }

  function editMateria(id) {
    const materia = window.DB.getMateriaById(id);
    editingMateriaId = id;
    document.getElementById('editorTitle').textContent = `Editando: ${materia.title}`;
    document.getElementById('editTitle').value = materia.title;
    document.getElementById('editImage').value = materia.image || '';
    document.getElementById('editTags').value = materia.tags || '';
    document.getElementById('editCategory').innerHTML = window.DB.getCategories().map(c => `<option value="${c.name}" ${c.name === materia.category ? 'selected' : ''}>${c.name}</option>`).join('');
    quill.root.innerHTML = materia.content;
    document.getElementById('editorModal').classList.add('visible');
  }

  function openEditor() {
    editingMateriaId = null;
    document.getElementById('editorTitle').textContent = 'Nova Matéria';
    document.getElementById('editTitle').value = '';
    document.getElementById('editImage').value = '';
    document.getElementById('editTags').value = '';
    quill.root.innerHTML = '';
    document.getElementById('editCategory').innerHTML = window.DB.getCategories().map(c => `<option value="${c.name}">${c.name}</option>`).join('');
    document.getElementById('editorModal').classList.add('visible');
  }

  function closeEditor() { document.getElementById('editorModal').classList.remove('visible'); }

  function previewMateria() {
    const previewData = {
      title: document.getElementById('editTitle').value,
      category: document.getElementById('editCategory').value,
      image: document.getElementById('editImage').value,
      tags: document.getElementById('editTags').value,
      content: quill.root.innerHTML,
      author: window.DB.currentUser,
      date: new Date().toISOString()
    };
    sessionStorage.setItem('preview_materia', JSON.stringify(previewData));
    window.open('noticia.html?preview=true', '_blank');
  }

  function saveMateria(status) {
    const title = document.getElementById('editTitle').value.trim();
    if (!title) return alert('Título obrigatório');
    const data = { title, category: document.getElementById('editCategory').value, image: document.getElementById('editImage').value, tags: document.getElementById('editTags').value, content: quill.root.innerHTML, status };
    if (editingMateriaId) window.DB.editMateria(editingMateriaId, data); else window.DB.addMateria(data);
    closeEditor(); renderMateriasAdmin(); updateDashboard();
  }

  function deleteMateria(id) { if (confirm('Excluir?')) { window.DB.deleteMateria(id); renderMateriasAdmin(); updateDashboard(); } }
  
  function renderHistory() { document.getElementById('historyListAdmin').innerHTML = window.DB.getHistory().map(i => `<div class="history-item"><span><strong>${i.user}</strong>: ${i.message}</span><span>${formatDate(i.time)}</span></div>`).join(''); }

  function renderUsers() {
    if (typeof window.DB.getUsers !== 'function') return;
    document.getElementById('usersList').innerHTML = Object.entries(window.DB.getUsers()).map(([username, data]) => `
      <div class="user-item">
        <div><strong>${username}</strong> (${data.name}) <span class="user-role">${data.level}</span></div>
        <div><button class="btn-delete-user" onclick="deleteUser('${username}')"><i class="fas fa-trash"></i> Remover</button></div>
      </div>
    `).join('');
  }

  function deleteUser(username) {
    if (username === 'admin') return alert('Não é possível remover o admin.');
    if (confirm(`Remover usuário "${username}"?`)) { window.DB.deleteUser(username); renderUsers(); }
  }

  function logout() {
    if (confirm('Deseja sair?')) {
      sessionStorage.removeItem('newsportal_user');
      window.location.reload();
    }
  }

  // ==========================================
  // INICIALIZAÇÃO SEGURA E EVENTOS
  // ==========================================
  document.addEventListener('DOMContentLoaded', async function() {
    
    // Login Seguro
    const loginForm = document.getElementById('loginForm');
    if (loginForm) {
      loginForm.addEventListener('submit', async function(e) {
        e.preventDefault();
        const submitBtn = document.getElementById('loginBtn');
        const originalText = submitBtn.textContent;
        submitBtn.textContent = 'Autenticando...';
        submitBtn.disabled = true;
        
        const u = document.getElementById('loginUser').value.trim();
        const p = document.getElementById('loginPass').value.trim();
        
        try {
          if (typeof window.DB === 'undefined' || !window.DB) throw new Error("DB não inicializado");

          // Tenta Login Seguro pelo Google Sheets
          if (typeof window.DB.login === 'function') {
            const res = await window.DB.login(u, p);
            if (res && res.success && res.user) {
              sessionStorage.setItem('newsportal_user', res.user.username);
              window.DB.currentUser = res.user.name;
              document.getElementById('loginOverlay').style.display = 'none';
              initAdminPanel();
            } else {
              alert('❌ Usuário ou senha incorretos!');
            }
          } 
          // Se falhar (offline ou código do apps script antigo), tenta localmente
          else {
            const users = window.DB.getUsers();
            if (users && users[u] && users[u].password === p) {
              sessionStorage.setItem('newsportal_user', u);
              window.DB.currentUser = users[u].name || u;
              document.getElementById('loginOverlay').style.display = 'none';
              initAdminPanel();
            } else {
              alert('❌ Usuário ou senha incorretos! (Modo Local)');
            }
          }
        } catch (err) {
          console.error(err);
          alert('❌ Erro de conexão com o banco de dados. Verifique a URL do App Script no database.js.');
        } finally {
          submitBtn.textContent = originalText;
          submitBtn.disabled = false;
        }
      });
    }

    const settingsForm = document.getElementById('settingsForm');
    if (settingsForm) {
      settingsForm.addEventListener('submit', function(e) {
        e.preventDefault();
        const s = {};
        ['primaryColor', 'secondaryColor', 'backgroundColor', 'textColor', 'fontFamily', 'headingFont', 'logoText', 'logoSubtext', 'logoIcon', 'containerMaxWidth', 'borderRadius'].forEach(id => {
          if(document.getElementById(id)) s[id] = document.getElementById(id).value;
        });
        window.DB.updateSettings(s); alert('Configurações salvas!');
      });
    }

    const categoryForm = document.getElementById('categoryForm');
    if (categoryForm) {
      categoryForm.addEventListener('submit', (e) => {
        e.preventDefault(); 
        window.DB.addCategory(document.getElementById('catName').value, document.getElementById('catIcon').value);
        document.getElementById('catName').value = ''; 
        document.getElementById('catIcon').value = 'fa-tag';
        renderCategories();
      });
    }

    const userForm = document.getElementById('userForm');
    if (userForm) {
      userForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const username = document.getElementById('newUsername').value.trim();
        const password = document.getElementById('newPassword').value.trim();
        const level = document.getElementById('newUserLevel').value;
        if (!username || !password) return alert('Preencha todos os campos.');
        if (typeof window.DB.addUser !== 'function') return alert('Função não suportada no cache local.');
        if (!window.DB.addUser(username, password, level, username)) return alert('Usuário já existe!');
        renderUsers(); document.getElementById('userForm').reset(); alert('✅ Usuário criado com sucesso!');
      });
    }

    // Inicialização principal
    if (typeof localforage === 'undefined') {
      alert("Aviso: Falha de rede. O sistema tentará carregar sem o cache otimizado.");
    }
    
    try {
      if (typeof window.Database === 'undefined') throw new Error("database.js não carregou");
      
      window.DB = await window.Database.init();
      const loggedUser = sessionStorage.getItem('newsportal_user');
      
      if (loggedUser && window.DB && typeof window.DB.getUsers === 'function' && window.DB.getUsers()[loggedUser]) {
        window.DB.currentUser = loggedUser;
        document.getElementById('loginOverlay').style.display = 'none';
        initAdminPanel();
      } else {
        document.getElementById('loginOverlay').style.display = 'flex';
      }
    } catch (e) {
      console.error(e);
      document.getElementById('loginOverlay').style.display = 'flex';
    }
  });
</script>
</body>
</html>
