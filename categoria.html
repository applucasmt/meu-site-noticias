<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="pageTitle">NewsPortal · Categoria</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="container">
    <header class="top-bar">
      <div class="logo-area">
        <span class="logo-icon"><i class="fas fa-newspaper"></i></span>
        <div class="logo">News<span>Portal</span> <small>· 2026</small></div>
      </div>
      <div class="header-actions">
        <div class="search-box">
          <i class="fas fa-search"></i>
          <input type="text" placeholder="Buscar notícias...">
        </div>
        <span class="btn-assine"><i class="fas fa-user-plus"></i> Assine</span>
      </div>
    </header>

    <nav class="main-nav" id="mainNav">
      <!-- Preenchido via JS -->
    </nav>

    <div class="page-header" id="categoryHeader">
      <h1 id="categoryTitle"><i class="fas fa-tag"></i> Categoria</h1>
      <p id="categoryDesc">Matérias desta categoria</p>
    </div>

    <div class="news-grid">
      <div class="destaque-principal" id="destaqueCategoria">
        <div class="card-img"><i class="fas fa-image"></i></div>
        <div class="card-body">
          <span class="categoria">Destaque</span>
          <h2 id="destaqueTitle">Carregando...</h2>
          <p class="resumo" id="destaqueResumo"></p>
          <div class="meta" id="destaqueMeta"></div>
        </div>
      </div>

      <aside class="sidebar">
        <div class="ad-box">
          <div class="ad-label"><i class="fas fa-bullhorn"></i> PUBLICIDADE</div>
          <div class="ad-content">
            <i class="fas fa-ad"></i> <strong>Anuncie aqui</strong>
            <p>Sua marca em destaque</p>
          </div>
        </div>

        <div class="sidebar-news" id="sidebarNews">
          <!-- Preenchido via JS -->
        </div>
      </aside>
    </div>

    <div class="section-title">
      <span><i class="fas fa-arrow-right"></i> Mais notícias</span>
    </div>

    <div class="news-secondary" id="materiasList">
      <!-- Preenchido via JS -->
    </div>

    <footer class="footer">
      <div class="footer-links">
        <a href="#">Sobre</a>
        <a href="#">Contato</a>
        <a href="#">Anuncie</a>
        <a href="#">Privacidade</a>
        <a href="#">Termos</a>
      </div>
      <div class="copy">&copy; 2026 NewsPortal · todos os direitos reservados.</div>
    </footer>
  </div>

  <div class="lock-icon" id="lockIcon" title="Pressione Ctrl e clique para acessar">
    <i class="fas fa-lock"></i>
  </div>

  <script src="data/database.js"></script>
  <script>
    // ============================================================
    // CATEGORIA DINÂMICA - Detecta slug pela URL
    // ============================================================
    (function() {
      const path = window.location.pathname;
      const slug = path.split('/').pop().replace('.html', '');
      
      // Buscar categoria pelo slug
      const category = DB.getCategoryBySlug(slug);
      
      if (!category) {
        document.getElementById('categoryTitle').textContent = 'Categoria não encontrada';
        document.getElementById('pageTitle').textContent = 'NewsPortal · 404';
        return;
      }

      // Atualizar título
      document.getElementById('pageTitle').textContent = `NewsPortal · ${category.name}`;
      document.getElementById('categoryTitle').innerHTML = `<i class="fas ${category.icon || 'fa-tag'}"></i> ${category.name}`;
      document.getElementById('categoryDesc').textContent = `Últimas matérias de ${category.name}`;

      // Renderizar menus
      function renderMenus() {
        const nav = document.getElementById('mainNav');
        const categories = DB.getCategories();
        
        let html = `<a href="index.html">Últimas</a>`;
        categories.forEach(cat => {
          const isActive = cat.slug === slug;
          html += `<a href="${cat.slug}.html" class="${isActive ? 'active' : ''}">
            <i class="fas ${cat.icon || 'fa-tag'}"></i> ${cat.name}
          </a>`;
        });
        nav.innerHTML = html;
      }

      // Renderizar matérias da categoria
      function renderMaterias() {
        const list = document.getElementById('materiasList');
        const materias = DB.getMaterias(slug);
        
        if (materias.length === 0) {
          list.innerHTML = `
            <div style="grid-column:1/-1; text-align:center; padding:3rem 0; color:#6b7a8f;">
              <i class="fas fa-inbox" style="font-size:2rem; display:block; margin-bottom:1rem;"></i>
              Nenhuma matéria encontrada em ${category.name}.
            </div>
          `;
          return;
        }

        list.innerHTML = materias.map(m => `
          <div class="news-card">
            <div class="card-img">
              ${m.image ? `<img src="${m.image}" alt="${m.title}">` : `<i class="fas ${category.icon || 'fa-tag'}"></i>`}
            </div>
            <div class="card-content">
              <span class="tag">${m.category}</span>
              <h4>${m.title}</h4>
              <div class="mini-meta">
                <i class="far fa-clock"></i> ${new Date(m.date).toLocaleString('pt-BR')}
              </div>
            </div>
          </div>
        `).join('');
      }

      // Atualizar destaque
      function updateDestaque() {
        const materias = DB.getMaterias(slug);
        if (materias.length === 0) return;
        
        const top = materias[0];
        document.getElementById('destaqueTitle').textContent = top.title;
        document.getElementById('destaqueResumo').textContent = top.content.replace(/<[^>]*>/g, '').substring(0, 150) + '...';
        document.getElementById('destaqueMeta').innerHTML = `
          <span><i class="far fa-clock"></i> ${new Date(top.date).toLocaleString('pt-BR')}</span>
          <span><i class="far fa-user"></i> ${top.author || 'NewsPortal'}</span>
          <span><i class="far fa-eye"></i> ${top.views || 0}</span>
        `;
        
        const imgEl = document.querySelector('#destaqueCategoria .card-img');
        if (top.image) {
          imgEl.innerHTML = `<img src="${top.image}" alt="${top.title}" style="width:100%;height:100%;object-fit:cover;">`;
        }
      }

      // Renderizar sidebar
      function renderSidebar() {
        const sidebar = document.getElementById('sidebarNews');
        const materias = DB.getMaterias(slug).slice(1, 4);
        
        sidebar.innerHTML = materias.map(m => `
          <div class="side-item">
            <div class="side-thumb"><i class="fas ${category.icon || 'fa-tag'}"></i></div>
            <div class="side-text">
              <h4>${m.title}</h4>
              <div class="side-meta"><i class="far fa-clock"></i> ${new Date(m.date).toLocaleString('pt-BR')}</div>
            </div>
          </div>
        `).join('');
      }

      // Cadeado
      let ctrlPressed = false;
      const lockIcon = document.getElementById('lockIcon');
      
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Control') {
          ctrlPressed = true;
          if (lockIcon) lockIcon.classList.add('visible');
        }
      });
      
      document.addEventListener('keyup', (e) => {
        if (e.key === 'Control') {
          ctrlPressed = false;
          setTimeout(() => {
            if (!ctrlPressed && lockIcon) {
              lockIcon.classList.remove('visible');
            }
          }, 300);
        }
      });
      
      if (lockIcon) {
        lockIcon.addEventListener('click', () => {
          window.location.href = 'admin.html';
        });
      }

      // Inicializar
      renderMenus();
      renderMaterias();
      updateDestaque();
      renderSidebar();

      console.log(`📰 Categoria: ${category.name} (${slug})`);
      console.log(`📄 ${DB.getMaterias(slug).length} matérias`);

    })();
  </script>
</body>
</html>
