<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="pageTitle">NewsPortal · Categoria</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; } body { font-family: 'Segoe UI', sans-serif; background: #f4f6f9; color: #1e2a3a; padding: 0 1rem; }
    a { text-decoration: none; color: inherit; } img { max-width: 100%; height: auto; display: block; }
    .container { max-width: 1280px; margin: 0 auto; background: white; box-shadow: 0 8px 24px rgba(0,0,0,0.05); border-radius: 0 0 1.5rem 1.5rem; overflow: hidden; padding: 0 1.5rem 2rem; }
    .top-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; padding: 1.2rem 0 0.8rem; border-bottom: 2px solid #eef2f7; }
    .logo-area { display: flex; align-items: center; gap: 0.5rem; } .logo-icon { font-size: 2rem; color: #d32f2f; }
    .logo { font-size: 1.9rem; font-weight: 700; } .logo span { color: #d32f2f; } 
    .main-nav { display: flex; gap: 1.2rem; padding: 0.8rem 0 0.2rem; border-bottom: 1px solid #e6ecf3; margin-bottom: 1.8rem; font-weight: 500; }
    .main-nav a { padding: 0.3rem 0; color: #2c3e50; border-bottom: 3px solid transparent; } .main-nav a.active { border-bottom-color: #d32f2f; color: #0b1a2a; }
    .page-header { padding: 1rem 0 1.5rem; margin-bottom: 1.5rem; border-bottom: 1px solid #eef2f7; }
    .page-header h1 { font-size: 2rem; font-weight: 700; } .page-header p { color: #6b7a8f; font-size: 1.1rem; }
    .news-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 2rem; margin-bottom: 2.5rem; }
    .destaque-principal { background: white; border-radius: 1.2rem; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,0.04); }
    .destaque-principal .card-img { height: 200px; background: #1e2a3a; display: flex; align-items: center; justify-content: center; font-size: 2.8rem; overflow: hidden; }
    .destaque-principal .card-img img { width: 100%; height: 100%; object-fit: cover; }
    .destaque-principal .card-body { padding: 1.5rem; }
    .categoria { display: inline-block; background: #d32f2f; color: white; font-size: 0.7rem; font-weight: 700; padding: 0.2rem 1rem; border-radius: 30px; margin-bottom: 0.7rem; text-transform: uppercase; }
    .destaque-principal h2 { font-size: 1.7rem; font-weight: 700; margin-bottom: 0.6rem; }
    .sidebar { display: flex; flex-direction: column; gap: 2rem; } .sidebar-news { background: #fafcff; border-radius: 1.2rem; }
    .side-item { display: flex; gap: 1rem; padding: 1rem 0.2rem; border-bottom: 1px solid #eceff5; }
    .side-item .side-thumb { min-width: 70px; height: 70px; border-radius: 0.8rem; background: #dbe1ea; overflow: hidden; display: flex; align-items: center; justify-content: center; }
    .side-item .side-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .side-item .side-text h4 { font-size: 0.95rem; margin-bottom: 0.2rem; }
    .news-secondary { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1.8rem; }
    .news-card { background: white; border-radius: 1rem; overflow: hidden; border: 1px solid #f0f4fc; }
    .news-card .card-img { height: 130px; background: #cfd9e6; overflow: hidden; }
    .news-card .card-img img { width: 100%; height: 100%; object-fit: cover; }
    .news-card .card-content { padding: 1rem; } .news-card h4 { font-size: 1rem; margin: 0.2rem 0; }
    .btn-load-more { display: block; width: 100%; max-width: 300px; margin: 2rem auto 0; padding: 0.8rem; text-align: center; background: #eef2f7; color: #4a5b6e; font-weight: 600; border-radius: 8px; border: none; cursor: pointer; transition: 0.2s; }
    @media (max-width: 900px) { .news-grid { grid-template-columns: 1fr; } } @media (max-width: 640px) { .news-secondary { grid-template-columns: 1fr 1fr; } }
  </style>
</head>
<body>
  <div class="container">
    <header class="top-bar">
      <div class="logo-area"><span class="logo-icon" id="logoIcon"><i class="fas fa-newspaper"></i></span><div class="logo" id="logoText">News<span>Portal</span></div></div>
    </header>
    <nav class="main-nav" id="mainNav"></nav>
    <div class="page-header"><h1 id="categoryTitle">Categoria</h1><p id="categoryDesc">Carregando...</p></div>
    
    <div class="news-grid">
      <article class="destaque-principal" id="destaquePrincipal">
        <div class="card-img" id="destaqueImg"></div>
        <div class="card-body"><span class="categoria" id="destaqueCategoria"></span><h2 id="destaqueTitulo"></h2></div>
      </article>
      <aside class="sidebar"><div class="sidebar-news" id="sidebarNews"></div></aside>
    </div>
    
    <div class="news-secondary" id="materiasList"></div>
    <button class="btn-load-more" id="btnLoadMore" onclick="loadMore()">Carregar mais notícias <i class="fas fa-chevron-down"></i></button>
  </div>

  <script src="data/database.js"></script>
  <script>
    let currentPage = 1; const itemsPerPage = 6;
    const slug = window.location.pathname.split('/').pop().replace('.html', '');
    let category = null;

    function renderMateriasList(reset = false) {
      if(reset) currentPage = 1;
      const materiasCat = window.DB.getMaterias(slug);
      const all = materiasCat.slice(5);
      const visible = all.slice(0, currentPage * itemsPerPage);
      
      document.getElementById('materiasList').innerHTML = visible.map(m => `
        <div class="news-card"><a href="noticia.html?id=${m.id}">
          <div class="card-img">${m.image ? `<img src="${m.image}">` : '<i class="fas fa-image"></i>'}</div>
          <div class="card-content"><span class="tag" style="color:${window.DB.getSettings().primaryColor}">${m.category}</span><h4>${m.title}</h4></div>
        </a></div>`).join('');
      document.getElementById('btnLoadMore').style.display = visible.length >= all.length ? 'none' : 'block';
    }
    
    function loadMore() { currentPage++; renderMateriasList(); }

    document.addEventListener('DOMContentLoaded', async () => {
      try {
        if (typeof window.Database === 'undefined') throw new Error('Banco de dados não carregado!');
        
        // A CORREÇÃO PRINCIPAL ESTÁ AQUI
        window.DB = await window.Database.init();
        category = window.DB.getCategoryBySlug(slug);
        
        if(!category) {
           document.getElementById('categoryTitle').innerHTML = `<i class="fas fa-exclamation-triangle" style="color:#e74c3c;"></i> Categoria não encontrada`;
           document.getElementById('categoryDesc').textContent = 'A categoria que você procura não existe ou foi removida.';
           document.getElementById('destaqueTitulo').textContent = 'Categoria não encontrada';
           document.getElementById('materiasList').innerHTML = '';
           return;
        }
        
        document.getElementById('categoryTitle').innerHTML = `<i class="fas ${category.icon}"></i> ${category.name}`;
        
        const materias = window.DB.getMaterias(slug);
        if(materias.length) {
          document.getElementById('destaqueImg').innerHTML = `<a href="noticia.html?id=${materias[0].id}">${materias[0].image ? `<img src="${materias[0].image}">` : '<i class="fas fa-image"></i>'}</a>`;
          document.getElementById('destaqueCategoria').innerText = materias[0].category;
          document.getElementById('destaqueTitulo').innerHTML = `<a href="noticia.html?id=${materias[0].id}">${materias[0].title}</a>`;
        }
        
        document.getElementById('sidebarNews').innerHTML = materias.slice(1,5).map(m => `<a href="noticia.html?id=${m.id}"><div class="side-item"><div class="side-thumb">${m.image ? `<img src="${m.image}">` : '<i class="fas fa-image"></i>'}</div><div class="side-text"><h4>${m.title}</h4></div></div></a>`).join('');
        renderMateriasList(true);
        
      } catch (error) {
        console.error('Erro na Categoria:', error);
      }
    });
  </script>
</body>
</html>
